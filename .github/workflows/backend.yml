name: Backend

on:
  pull_request:
    branches: [staging, main]
    paths: ["backend/**"]
  push:
    branches: [staging, main]
    paths: ["backend/**"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx tsc --noEmit
