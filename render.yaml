services:
  - type: web
    name: reach-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: RPC_URL
        value: https://rpc.testnet.arc.io
      - key: REACH_ADDRESS
        value: "0x75E4Eb5F40c48e89e0FDA6e32E88459F5d97183D"
      - key: REACH_DEPLOY_BLOCK
        value: "61080712"
      - key: USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: EURC_ADDRESS
        value: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a"
      - key: DB_PATH
        value: reach.sqlite
      - key: CORS_ORIGIN
        value: "*" # tighten to the deployed frontend URL once it exists
      # secrets and account-specific values — set these in the Render dashboard,
      # not here, so they never end up in version control
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
